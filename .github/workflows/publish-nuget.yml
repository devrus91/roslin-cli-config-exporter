name: NuGet Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 0.2.0
        required: true
        type: string
      publish:
        description: Publish the package to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/RoslynConfigExporter/RoslynConfigExporter.csproj
            tests/RoslynConfigExporter.Tests/RoslynConfigExporter.Tests.csproj
            samples/SampleApp/SampleApp.csproj

      - name: Resolve and validate package version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          PACKAGE_VERSION="${REQUESTED_VERSION#v}"
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore RoslynConfigExporter.slnx

      - name: Verify formatting
        run: dotnet format RoslynConfigExporter.slnx --verify-no-changes --no-restore

      - name: Build
        run: >-
          dotnet build RoslynConfigExporter.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Test
        run: dotnet test RoslynConfigExporter.slnx --configuration Release --no-build

      - name: Pack dotnet tool
        run: >-
          dotnet pack src/RoslynConfigExporter/RoslynConfigExporter.csproj
          --configuration Release
          --no-build
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}
          --output artifacts/package

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: RoslynConfigExporter.Tool-${{ env.PACKAGE_VERSION }}
          path: artifacts/package/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/package/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
